<body>
  <header>

<section class="hero fade-in">...</section>
<section class="gallery fade-in">...</section>
<section class="shop fade-in">...</section>

</body>
<script>
  const galleryImages = document.querySelectorAll('.gallery img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const closeBtn = document.querySelector('.close');

  galleryImages.forEach(img => {
    img.addEventListener('click', () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = img.src;
    });
  });

  closeBtn.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target !== lightboxImg) {
      lightbox.style.display = 'none';
    }
  });
</script>
<script>
  function payWithPaystack(){
    var handler = PaystackPop.setup({
      key: 'your-public-key-here', // Replace with your Paystack public key
      email: 'customer@email.com', // You can dynamically set this
      amount: 15000 * 100, // Amount in kobo (₦15000 here)
      currency: 'NGN',
      ref: ''+Math.floor((Math.random() * 1000000000) + 1), // Unique transaction reference
      callback: function(response){
        alert('Payment successful! Reference: ' + response.reference);
      },
      onClose: function(){
        alert('Transaction was not completed, window closed.');
      }
    });
    handler.openIframe();
  }
</script>
<script>
  const faders = document.querySelectorAll('.fade-in');

  const appearOptions = {
    threshold: 0.2,
    rootMargin: "0px 0px -50px 0px"
  };

  const appearOnScroll = new IntersectionObserver(function(entries, appearOnScroll) {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('visible');
      appearOnScroll.unobserve(entry.target);
    });
  }, appearOptions);

  faders.forEach(fader => {
    appearOnScroll.observe(fader);
  });
</script>
